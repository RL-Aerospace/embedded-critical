# Recursive-delete policy for Linux hosts, read by .claude/hooks/guard.py.
#
# Covered shells:
#   - the Bash tool (bash/sh), dialect "bash"
#   - the PowerShell tool if PowerShell 7 (pwsh) is installed, dialect "powershell"
# There is no cmd.exe on Linux, so no "cmd" rules.
#
# A matching command is denied unless every target resolves inside a
# whitelisted folder. Anything the guard cannot resolve is denied.

schema = 1
os = "linux"

[whitelist]
# Folders, relative to the repo root, in which recursive deletes are permitted.
# The folder itself and everything under it are allowed.
# Example: paths = ["build", "out/linux"]
paths = []

[[delete]]
name = "rm -r (coreutils)"
# Also applied to pwsh, where rm/rmdir run the native binaries.
dialects = ["bash", "powershell"]
commands = ["rm"]
parser = "posix-rm"
recursive_short = ["r", "R"]
recursive_long = ["--recursive"]

[[delete]]
name = "Remove-Item -Recurse (PowerShell 7)"
dialects = ["powershell"]
commands = ["remove-item", "ri", "del", "erase", "rd", "rm", "rmdir"]
parser = "powershell-remove"
# Parameter names; any unambiguous prefix (e.g. -r, -Rec) is matched.
recursive_params = ["-recurse"]
path_params = ["-path", "-literalpath", "-lp", "-pspath"]
value_params = ["-filter", "-include", "-exclude", "-credential", "-stream"]
# Note: Remove-Item fed from the pipeline (gci -r | Remove-Item) is always denied.

[[delete]]
name = "find -delete / -exec rm (findutils)"
dialects = ["bash", "powershell"]
commands = ["find"]
parser = "find"
delete_actions = ["-delete"]
exec_actions = ["-exec", "-execdir", "-ok", "-okdir"]
exec_delete_commands = ["rm", "rmdir", "rimraf"]
# Commands run by -exec whose effect cannot be inspected; these are denied.
exec_opaque_commands = ["sh", "bash", "zsh", "dash", "xargs", "python", "python3",
                        "perl", "ruby", "node", "pwsh"]

[[delete]]
name = "rimraf"
dialects = ["bash", "powershell"]
commands = ["rimraf"]
parser = "targets"

[git_clean]
# Short flags of `git clean` that make it delete directories or ignored trees
# (bundles such as -fdx count). `git clean -n/--dry-run` is not a delete.
recursive_flags = ["d", "x", "X"]

[inline_code]
# Interpreters whose arguments are scanned for recursive-delete code
# (e.g. python3 -c "import shutil; shutil.rmtree('x')"). Matches are denied.
interpreters = ["python", "python3", "node", "perl", "ruby"]
patterns = [
    'rmtree',
    'remove_tree',
    'removedirs',
    'rmSync',
    'fs\.rm\b',
    'fs\.rmdir',
    'rimraf',
    'Remove-Item',
    'remove_dir_all',
    'rm_r\b',
    'rm_rf',
    '\brm\s+-[A-Za-z]*[rR]',
    'Directory\]?::Delete',
    'Directory\.Delete',
]

[[command_pattern]]
name = ".NET recursive delete (PowerShell)"
dialects = ["powershell"]
regex = '(\]::|\.)Delete(Directory)?$'
